<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Queue Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hospital Queue Management</h1>
        
        <div class="control-buttons">
            <div class="control-section">
                <h2>Reception</h2>
                <button id="generateToken" class="btn btn-primary">Generate New Token</button>
                <div id="lastToken" class="token-display">Last token: None</div>
            </div>
            
            <div class="control-section">
                <h2>Nurse/Doctor</h2>
                <button id="callNext" class="btn btn-secondary">Call Next Patient</button>
                <div id="currentToken" class="token-display">Current token: None</div>
            </div>
        </div>
        
        <div class="queue-preview">
            <h2>Queue Status</h2>
            <p>Click to <a href="display.html" target="_blank">open full-screen display</a> for waiting area TV</p>
            <div id="queueContainer" class="queue-container">
                <p>Loading queue data...</p>
            </div>
        </div>
    </div>
    
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    
    <!-- Firebase Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Our application script -->
    <script src="app.js"></script>
</body>
</html>
